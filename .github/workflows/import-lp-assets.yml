name: Import LP assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-lp-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install chromium

      - name: Download source ZIP from firestorage
        shell: bash
        run: |
          set -euo pipefail
          cat > download.mjs <<'JS'
          import { chromium } from 'playwright';
          const url = 'https://firestorage.ai/ja/f/UU3f7Ka0syj0';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();
          page.on('request', r => {
            const u=r.url();
            if (/download|api|file|storage/i.test(u)) console.log('REQ', r.method(), u);
          });
          page.on('response', r => {
            const u=r.url();
            if (/download|api|file|storage/i.test(u)) console.log('RES', r.status(), u);
          });
          await page.goto(url,{waitUntil:'networkidle',timeout:60000});
          console.log('TITLE', await page.title());
          const texts = await page.locator('a,button').allTextContents();
          console.log('CONTROLS', texts.map(x=>x.trim()).filter(Boolean).slice(0,80));
          let target = page.getByRole('button',{name:/ダウンロード|download/i}).first();
          if (await target.count() === 0) target = page.getByRole('link',{name:/ダウンロード|download/i}).first();
          if (await target.count() === 0) {
            const candidates = page.locator('a,button');
            const n = await candidates.count();
            for (let i=0;i<n;i++) {
              const t=(await candidates.nth(i).innerText().catch(()=>'' )).trim();
              if (/保存|受け取|download|ダウンロード/i.test(t)) { target=candidates.nth(i); break; }
            }
          }
          if (await target.count() === 0) throw new Error('Download control not found');
          const downloadPromise = page.waitForEvent('download',{timeout:60000});
          await target.click();
          const download = await downloadPromise;
          console.log('DOWNLOADED', download.suggestedFilename());
          await download.saveAs('/tmp/lp.zip');
          await browser.close();
          JS
          node download.mjs
          file /tmp/lp.zip
          python - <<'PY'
          import pathlib
          p=pathlib.Path('/tmp/lp.zip')
          assert p.exists() and p.read_bytes()[:4]==b'PK\x03\x04', 'not a ZIP archive'
          print('ZIP bytes', p.stat().st_size)
          PY

      - name: Import exact LP files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lp-unzip
          mkdir -p /tmp/lp-unzip
          unzip -q /tmp/lp.zip -d /tmp/lp-unzip
          test -f /tmp/lp-unzip/index.html
          test -d /tmp/lp-unzip/assets
          rm -rf assets
          cp -R /tmp/lp-unzip/assets ./assets
          cp /tmp/lp-unzip/index.html ./index.html
          rm -f download.mjs package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Import Hime bridge LP assets from source ZIP'
            git push origin main
          fi
