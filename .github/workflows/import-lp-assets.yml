name: Import LP assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-lp-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect firestorage share and import ZIP
        shell: bash
        run: |
          set -euo pipefail
          SHARE_URL='https://firestorage.ai/ja/f/UU3f7Ka0syj0'
          python - <<'PY'
          import re, urllib.request, pathlib, sys
          share='https://firestorage.ai/ja/f/UU3f7Ka0syj0'
          req=urllib.request.Request(share, headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          pathlib.Path('/tmp/fire.html').write_text(html)
          print('share html bytes:', len(html))
          pats=[
              r'https?://[^\"\'<> ]+',
              r'href=[\"\']([^\"\']+)[\"\']',
              r'src=[\"\']([^\"\']+)[\"\']',
          ]
          vals=[]
          for p in pats:
              for m in re.finditer(p, html):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if any(k in v.lower() for k in ('download','zip','file','storage','api')):
                      vals.append(v)
          print('candidate urls:')
          for v in dict.fromkeys(vals):
              print(v[:1000])
          PY

          # First try the share URL itself as a downloadable archive.
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "$SHARE_URL" -o /tmp/candidate || true
          if file /tmp/candidate 2>/dev/null | grep -qi 'zip archive'; then
            mv /tmp/candidate /tmp/lp.zip
          fi

          # Search HTML for likely absolute download URLs and test them.
          if [ ! -f /tmp/lp.zip ]; then
            python - <<'PY'
          import re, pathlib, urllib.parse, urllib.request
          html=pathlib.Path('/tmp/fire.html').read_text()
          share='https://firestorage.ai/ja/f/UU3f7Ka0syj0'
          raw=set(re.findall(r'https?://[^\"\'<> ]+', html))
          raw.update(urllib.parse.urljoin(share,x) for x in re.findall(r'href=[\"\']([^\"\']+)[\"\']',html))
          cand=[u for u in raw if any(k in u.lower() for k in ('download','zip','file'))]
          for u in cand:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':share})
                  data=urllib.request.urlopen(req,timeout=30).read()
                  if data[:4]==b'PK\x03\x04':
                      pathlib.Path('/tmp/lp.zip').write_bytes(data)
                      print('FOUND ZIP:',u)
                      break
              except Exception as e:
                  print('candidate failed:',u,repr(e))
          PY
          fi

          test -f /tmp/lp.zip || { echo 'No ZIP download URL found'; exit 2; }
          rm -rf /tmp/lp-unzip
          mkdir -p /tmp/lp-unzip
          unzip -q /tmp/lp.zip -d /tmp/lp-unzip
          test -f /tmp/lp-unzip/index.html
          test -d /tmp/lp-unzip/assets
          rm -rf assets
          cp -R /tmp/lp-unzip/assets ./assets
          cp /tmp/lp-unzip/index.html ./index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Import Hime bridge LP assets from source ZIP'
            git push origin main
          fi
