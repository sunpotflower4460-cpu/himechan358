name: Import LP assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-lp-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover firestorage download endpoint
        shell: bash
        run: |
          set -euo pipefail
          SHARE_URL='https://firestorage.ai/ja/f/UU3f7Ka0syj0'
          curl -L --fail -A 'Mozilla/5.0' "$SHARE_URL" -o /tmp/fire.html
          JS_PATH=$(python - <<'PY'
          import re, pathlib
          html=pathlib.Path('/tmp/fire.html').read_text()
          m=re.search(r'(/_next/static/chunks/app/\(files\)/ja/f/page-[^"\']+\.js)', html)
          print(m.group(1) if m else '')
          PY
          )
          echo "JS_PATH=$JS_PATH"
          test -n "$JS_PATH"
          curl -L --fail -A 'Mozilla/5.0' "https://firestorage.ai$JS_PATH" -o /tmp/app.js
          echo '--- endpoint candidates ---'
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('/tmp/app.js').read_text(errors='replace')
          pats=[
            r'[^\"\']{0,120}(?:download|presign|signed|public_id|share_url|/api/)[^\"\']{0,220}',
            r'[\"\']([^\"\']*(?:/api/|download|presign|signed)[^\"\']*)[\"\']'
          ]
          out=[]
          for p in pats:
            for m in re.finditer(p,s,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if v not in out:
                out.append(v)
          for v in out[:200]:
            print(v[:500])
          PY
          exit 2

# diagnostic v2
